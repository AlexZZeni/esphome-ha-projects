substitutions:
  # Protocolo do ar. Veja no README como descobrir o seu.
  ac_platform: coolix

esphome:
  name: ar-condicionado
  friendly_name: Ar-condicionado

esp32:
  board: esp32dev

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_password

captive_portal:

remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO27
    inverted: true
    mode: INPUT_PULLUP
  # Mostra no log os códigos do controle. Remova depois de identificar o protocolo.
  dump: all

climate:
  - platform: ${ac_platform}
    name: None
    transmitter_id: ir_tx
    receiver_id: ir_rx
