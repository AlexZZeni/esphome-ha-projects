substitutions:
  # Protocolo do ar. Veja no README como descobrir o seu.
  ac_platform: mirage

esphome:
  name: ar-condicionado
  friendly_name: Ar-condicionado

esp32:
  board: esp32dev

# Componentes deste repositório, como a plataforma mirage.
external_components:
  - source:
      type: local
      path: components

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_password

captive_portal:

remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO27
    inverted: true
    mode: INPUT_PULLUP

i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: sht3xd
    # Algumas plaquinhas usam 0x45.
    address: 0x44
    temperature:
      name: Temperatura
      id: temperatura_ambiente
    humidity:
      name: Humidade
    update_interval: 60s

climate:
  - platform: ${ac_platform}
    name: None
    transmitter_id: ir_tx
    receiver_id: ir_rx
    sensor: temperatura_ambiente
