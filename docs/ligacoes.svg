<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-label="O ESP32 liga ao receptor IR nos pinos D27, GND e 3V3; ao sensor SHT31 nos pinos D21, D22, GND e 3V3; e ao emissor IR pelo pino D4, com resistor de 1 quilo-ohm na base do transistor, e pelo pino VIN, com resistor de 47 ohms em série com o LED até o coletor. O emissor do transistor vai ao GND.">
<style>
svg { color: #1b2327; background: #fbfcfc; }
svg text { font: 12px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: currentColor; }
svg .mono { font: 12px ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
svg .b { font-weight: 600; }
svg .title { font-size: 14px; font-weight: 600; }
svg .small { font-size: 11px; fill: #55636a; }
svg .mid { text-anchor: middle; }
svg .end { text-anchor: end; }
svg .box { fill: #edf1f0; stroke: #b8c4c6; stroke-width: 1.5; }
svg .part { fill: #fbfcfc; stroke: currentColor; stroke-width: 1.8; }
svg .sym { fill: none; stroke: currentColor; stroke-width: 2; }
svg .solid { fill: currentColor; }
svg .w { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
svg .w5v { stroke: #cf2f2f; } svg .t5v { fill: #cf2f2f; }
svg .w33 { stroke: #c26a00; } svg .t33 { fill: #c26a00; }
svg .wgnd { stroke: #20282c; } svg .tgnd { fill: #20282c; }
svg .wsda { stroke: #1769c2; } svg .tsda { fill: #1769c2; }
svg .wscl { stroke: #11825a; } svg .tscl { fill: #11825a; }
svg .wsig { stroke: #7b3fc4; } svg .tsig { fill: #7b3fc4; }
svg .wled { stroke: #72828a; }
svg .wt { font-weight: 600; }
svg .pcb { fill: #123f3a; }
svg .chip { fill: #24302f; stroke: #9dbdb4; }
svg .usb { fill: #9dbdb4; stroke: #123f3a; }
svg .on-pcb { fill: #e9f4f0; }
svg .pin { font: 12px ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; fill: #9dbdb4; }
svg .pin.on { fill: #e9f4f0; font-weight: 600; }
svg .pad { fill: #e5bf58; stroke: #123f3a; stroke-width: 1; }
svg .hole { fill: #123f3a; stroke: #9dbdb4; stroke-width: 1; }
svg .pad-part { fill: #e5bf58; stroke: #1b2327; stroke-width: 1; }
svg .hole-part { fill: #fbfcfc; stroke: #55636a; stroke-width: 1; }
</style>
<rect width="1040" height="690" fill="#fbfcfc"/>
<defs>
