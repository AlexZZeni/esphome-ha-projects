<text x="510" y="296" class="mid on-pcb b">DOIT DevKit</text>
<text x="510" y="313" class="mid on-pcb">30 pinos</text>

<text x="412" y="94" class="pin">EN</text>
<text x="412" y="124" class="pin">VP</text>
