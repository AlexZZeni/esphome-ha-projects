<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="700" viewBox="0 0 1220 700" role="img" aria-label="O ESP32 recebe 5 V da fonte no pino VIN e GND no GND. O módulo RS-485 liga o RO ao RX2 (GPIO16), o GND ao GND, o VCC ao 3V3, e tem o DE e o RE ligados ao GND; o DI fica sem ligar. O A e o B do módulo vão ao Y/A e ao G/B do cabo do controlador, e o GND do cabo vai ao GND comum; o 12V do cabo fica sem ligar. O sensor SHT31 liga o SDA ao D21, o SCL ao D22, o GND ao GND e o VIN ao 3V3.">
<style>
svg { color: #1b2327; background: #fbfcfc; }
svg text { font: 12px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: currentColor; }
svg .mono { font: 12px ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
svg .b { font-weight: 600; }
svg .title { font-size: 14px; font-weight: 600; }
svg .small { font-size: 11px; fill: #55636a; }
svg .mid { text-anchor: middle; }
svg .end { text-anchor: end; }
svg .box { fill: #edf1f0; stroke: #b8c4c6; stroke-width: 1.5; }
svg .solid { fill: currentColor; }
svg .w { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
svg .w5v { stroke: #cf2f2f; } svg .t5v { fill: #cf2f2f; }
svg .w33 { stroke: #c26a00; } svg .t33 { fill: #c26a00; }
svg .wgnd { stroke: #20282c; } svg .tgnd { fill: #20282c; }
svg .wsda { stroke: #1769c2; } svg .tsda { fill: #1769c2; }
svg .wscl { stroke: #11825a; } svg .tscl { fill: #11825a; }
svg .wsig { stroke: #7b3fc4; } svg .tsig { fill: #7b3fc4; }
svg .wa { stroke: #b5367a; } svg .ta { fill: #b5367a; }
svg .wb { stroke: #2a8fa3; } svg .tb { fill: #2a8fa3; }
svg .wt { font-weight: 600; }
svg .off { fill: #8a979c; }
svg .pcb { fill: #123f3a; }
svg .chip { fill: #24302f; stroke: #9dbdb4; }
svg .usb { fill: #9dbdb4; stroke: #123f3a; }
svg .on-pcb { fill: #e9f4f0; }
svg .pin { font: 12px ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; fill: #9dbdb4; }
svg .pin.on { fill: #e9f4f0; font-weight: 600; }
svg .pad { fill: #e5bf58; stroke: #123f3a; stroke-width: 1; }
svg .hole { fill: #123f3a; stroke: #9dbdb4; stroke-width: 1; }
svg .pad-part { fill: #e5bf58; stroke: #1b2327; stroke-width: 1; }
svg .hole-part { fill: #fbfcfc; stroke: #55636a; stroke-width: 1; }
</style>
<rect width="1220" height="700" fill="#fbfcfc"/>

<!-- Legenda -->
<text x="30" y="48" class="title">Como ler</text>
<path class="w w5v" d="M30 72H70"></path><text x="82" y="76">5 V (VIN)</text>
<path class="w w33" d="M30 97H70"></path><text x="82" y="101">3V3</text>
<path class="w wgnd" d="M30 122H70"></path><text x="82" y="126">GND</text>
<path class="w wsda" d="M30 147H70"></path><text x="82" y="151">SDA do sensor</text>
<path class="w wscl" d="M30 172H70"></path><text x="82" y="176">SCL do sensor</text>
<path class="w wsig" d="M30 197H70"></path><text x="82" y="201">Dados recebidos (RO → RX2)</text>
<path class="w wa" d="M30 222H70"></path><text x="82" y="226">Linha A do barramento</text>
<path class="w wb" d="M30 247H70"></path><text x="82" y="251">Linha B do barramento</text>
<path class="w wgnd" d="M30 272H70"></path><circle cx="50" cy="272" r="5" class="solid"></circle><text x="82" y="276">Ponto: fios ligados</text>
<path class="w wgnd" d="M30 297H42a8 8 0 0 1 16 0H70"></path><path class="w wgnd" d="M50 285V309" opacity=".55"></path><text x="82" y="301">Arco: cruzam sem encostar</text>

<!-- Fonte -->
<rect x="190" y="455" width="140" height="85" rx="4" class="box"></rect>
<text x="202" y="492" class="title">Fonte de 5 V</text>
<text x="202" y="510" class="small">ou o USB da placa</text>
<text x="318" y="484" class="mono b end">−</text>
<text x="318" y="514" class="mono b end">+</text>
<path class="w wgnd" d="M330 480H460"></path>
<path class="w w5v" d="M330 510H460"></path>
<text x="395" y="473" class="mid wt tgnd">GND</text>
<text x="395" y="503" class="mid wt t5v">5 V</text>

<!-- Observações -->
<text x="30" y="596" class="b">A placa só escuta o barramento</text>
<text x="30" y="616" class="small">• o RO vai no RX2 (GPIO16) e o UART não tem pino de TX</text>
<text x="30" y="634" class="small">• o DE e o RE no GND deixam o transmissor do módulo desligado</text>
<text x="30" y="652" class="small">• o módulo entra em paralelo com o controlador, sem desligar nada</text>
<text x="30" y="670" class="small">• o 12V do cabo do controlador fica sem ligar</text>

<!-- Placa (mesmo desenho do esquema do ar-condicionado por IR, deslocado 60 px) -->
<g transform="translate(60 0)">
