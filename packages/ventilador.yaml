# Ventilador de teto com luz, controlado por IR (protocolo NEC, endereço 0xFF00).
# Precisa do pacote ir. Veja os códigos e o funcionamento em docs/ventilador.md.
#
# O ESPHome guarda o comando NEC como "inverso << 8 | código": o botão 0x08 vira 0xF708.
#
# Ventilador: as velocidades ligam direto. O 0x18 só alterna, então é usado apenas para desligar.
#
# Luz: o aparelho não informa o estado, então a placa guarda em que passo ele está e manda a diferença.
#   Brilho: passos 0 (botão de brilho mínimo) a 10 (máximo).
#   Cor: passos 0 (W, mais branca) a 10 (WW, mais amarela), com o NW no passo 5.
#   WW, NW e W acendem a luz e voltam o brilho para o máximo.
#   O liga/desliga volta com o mesmo brilho e a mesma cor.

esphome:
  on_boot:
    priority: -100
    then:
      # Depois de restaurar o estado salvo, passa a transmitir. Assim a placa não mexe no aparelho ao reiniciar.
      - lambda: id(ventilador_sincronizando) = false;
      # A luz grava as saídas no loop, depois do boot. Espera essa primeira gravação passar.
      - delay: 2s
      - lambda: id(luz_pronta) = true;

globals:
  # Verdadeiro enquanto o estado vem do controle original ou da restauração no boot, para não retransmitir.
  - id: ventilador_sincronizando
    type: bool
    initial_value: "true"
  - id: ventilador_ligado_anterior
    type: bool
    initial_value: "false"
  - id: ventilador_velocidade_anterior
    type: int
    initial_value: "0"
  # Momento da última transmissão. O receptor capta o próprio sinal, que precisa ser ignorado.
  - id: ventilador_ultimo_envio
    type: uint32_t
    initial_value: "0"
  - id: luz_pronta
    type: bool
    initial_value: "false"
  # Estado do aparelho, como a placa acredita que ele está.
  - id: luz_ligada
    type: bool
    initial_value: "false"
  - id: luz_passo_brilho
    type: int
    initial_value: "10"
  - id: luz_passo_cor
    type: int
    initial_value: "5"
  # Estado que o aparelho deve alcançar. O laço luz_enviar manda um passo por vez até chegar nele.
  - id: luz_alvo_ligada
    type: bool
    initial_value: "false"
  - id: luz_alvo_brilho
    type: int
    initial_value: "10"
  - id: luz_alvo_cor
    type: int
    initial_value: "5"
  # Passos a mais que faltam mandar numa ponta, para acertar a contagem se ela tiver se perdido.
  - id: luz_extra_brilho
    type: int
    initial_value: "0"
  - id: luz_extra_cor
    type: int
    initial_value: "0"
  - id: luz_proximo_comando
    type: int
    initial_value: "0"

script:
  - id: ventilador_enviar
    mode: queued
    max_runs: 10
    parameters:
      comando: int
    then:
      - lambda: id(ventilador_ultimo_envio) = millis();
      - remote_transmitter.transmit_nec:
          transmitter_id: ir_tx
          address: 0xFF00
          command: !lambda return comando;
          command_repeats: 1
      # Intervalo entre comandos seguidos, para o aparelho não perder nenhum.
      - delay: 300ms
      - lambda: id(ventilador_ultimo_envio) = millis();

  # Converte o estado pedido à luz em passos do aparelho e inicia o envio.
  # Lê o estado da luz, e não as saídas, porque com a luz apagada a saída de brilho fica em zero e o brilho e a cor
  # pedidos se perderiam.
  # O modo restart com a espera junta as duas saídas da luz e os movimentos do controle deslizante.
  - id: luz_aplicar
    mode: restart
    then:
      - delay: 150ms
      - lambda: |-
          const auto &pedido = id(luz).remote_values;
          auto traits = id(luz).get_traits();
          const float frio = traits.get_min_mireds(), quente = traits.get_max_mireds();
          const float nivel_cor = (pedido.get_color_temperature() - frio) / (quente - frio);
          const bool ligar = pedido.is_on();
          const int brilho = std::clamp((int) lroundf(pedido.get_brightness() * 11) - 1, 0, 10);
          const int cor = std::clamp((int) lroundf(nivel_cor * 10), 0, 10);
          if (brilho != id(luz_alvo_brilho))
            id(luz_extra_brilho) = 0;
          if (cor != id(luz_alvo_cor))
            id(luz_extra_cor) = 0;
          id(luz_alvo_ligada) = ligar;
          id(luz_alvo_brilho) = brilho;
          id(luz_alvo_cor) = cor;
          if (!id(luz_pronta)) {
            // No boot, o estado restaurado é só copiado, sem transmitir.
            id(luz_ligada) = ligar;
            id(luz_passo_brilho) = id(luz_alvo_brilho);
            id(luz_passo_cor) = id(luz_alvo_cor);
            return;
          }
          if (!id(luz_enviar).is_running())
            id(luz_enviar).execute();

  # Manda um passo por vez até o aparelho chegar no alvo. Se o alvo mudar no meio, segue para o novo.
  - id: luz_enviar
    mode: single
    then:
      - while:
          condition:
            lambda: |-
              bool &ligada = id(luz_ligada);
              int &brilho = id(luz_passo_brilho);
              int &cor = id(luz_passo_cor);
              const int alvo_brilho = id(luz_alvo_brilho), alvo_cor = id(luz_alvo_cor);
              int &comando = id(luz_proximo_comando);
              if (!id(luz_alvo_ligada)) {
                if (!ligada)
                  return false;
                comando = 0xB946;
                ligada = false;
                return true;
              }
              if (!ligada) {
                comando = 0xB946;
                ligada = true;
                return true;
              }
              // Cor. Ao chegar numa ponta, manda 2 passos a mais.
              if (cor != alvo_cor) {
                comando = alvo_cor > cor ? 0xE916 : 0xF20D;
                cor += alvo_cor > cor ? 1 : -1;
                if (cor == 0 || cor == 10)
                  id(luz_extra_cor) = 2;
                return true;
              }
              if (id(luz_extra_cor) > 0 && (cor == 0 || cor == 10)) {
                comando = cor == 10 ? 0xE916 : 0xF20D;
                id(luz_extra_cor)--;
                return true;
              }
              // Brilho. O mínimo tem botão próprio; ao chegar no máximo, manda 2 passos a mais.
              if (brilho != alvo_brilho) {
                if (alvo_brilho == 0) {
                  comando = 0xB847;
                  brilho = 0;
                  return true;
                }
                comando = alvo_brilho > brilho ? 0xF609 : 0xF807;
                brilho += alvo_brilho > brilho ? 1 : -1;
                if (brilho == 10)
                  id(luz_extra_brilho) = 2;
                return true;
              }
              if (id(luz_extra_brilho) > 0 && brilho == 10) {
                comando = 0xF609;
                id(luz_extra_brilho)--;
                return true;
              }
              return false;
          then:
            - lambda: id(ventilador_ultimo_envio) = millis();
            - remote_transmitter.transmit_nec:
                transmitter_id: ir_tx
                address: 0xFF00
                command: !lambda return id(luz_proximo_comando);
                command_repeats: 1
            - delay: 300ms
            - lambda: id(ventilador_ultimo_envio) = millis();

  # Mostra no Home Assistant o estado guardado, depois de um comando do controle original.
  - id: luz_publicar
    then:
      - lambda: |-
          auto traits = id(luz).get_traits();
          const float frio = traits.get_min_mireds(), quente = traits.get_max_mireds();
          auto call = id(luz).make_call();
          call.set_state(id(luz_ligada));
          call.set_brightness((id(luz_passo_brilho) + 1) / 11.0f);
          call.set_color_temperature(frio + (quente - frio) * id(luz_passo_cor) / 10.0f);
          call.set_transition_length(0);
          call.perform();

output:
  - platform: template
    id: luz_saida_brilho
    type: float
    write_action:
      - script.execute: luz_aplicar
  - platform: template
    id: luz_saida_cor
    type: float
    write_action:
      - script.execute: luz_aplicar

light:
  - platform: color_temperature
    id: luz
    name: Luz
    brightness: luz_saida_brilho
    color_temperature: luz_saida_cor
    # Valores aproximados das cores W e WW. O aparelho não informa a temperatura real.
    cold_white_color_temperature: 6000 K
    warm_white_color_temperature: 3000 K
    # Brilho linear, para cada passo do aparelho valer o mesmo no Home Assistant.
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF

fan:
  - platform: template
    id: ventilador
    name: Ventilador
    speed_count: 3
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - lambda: |-
          const bool ligado = id(ventilador).state;
          const int velocidade = id(ventilador).speed;
          const bool estava_ligado = id(ventilador_ligado_anterior);
          const int velocidade_anterior = id(ventilador_velocidade_anterior);
          id(ventilador_ligado_anterior) = ligado;
          id(ventilador_velocidade_anterior) = velocidade;
          if (id(ventilador_sincronizando))
            return;
          if (ligado && (!estava_ligado || velocidade != velocidade_anterior)) {
            static const int codigos[] = {0xF708, 0xE31C, 0xA55A};
            id(ventilador_enviar).execute(codigos[std::clamp(velocidade, 1, 3) - 1]);
          } else if (!ligado && estava_ligado) {
            id(ventilador_enviar).execute(0xE718);
          }

remote_receiver:
  id: ir_rx
  on_nec:
    then:
      - lambda: |-
          if (x.address != 0xFF00)
            return;
          if (millis() - id(ventilador_ultimo_envio) < 500)
            return;

          // Ventilador
          int velocidade = -1;
          switch (x.command) {
            case 0xF708: velocidade = 1; break;
            case 0xE31C: velocidade = 2; break;
            case 0xA55A: velocidade = 3; break;
            case 0xE718: velocidade = 0; break;
          }
          if (velocidade >= 0) {
            id(ventilador_sincronizando) = true;
            if (velocidade > 0) {
              auto call = id(ventilador).turn_on();
              call.set_speed(velocidade);
              call.perform();
            } else {
              id(ventilador).toggle().perform();
            }
            id(ventilador_sincronizando) = false;
            return;
          }

          // Luz
          bool &ligada = id(luz_ligada);
          int &brilho = id(luz_passo_brilho);
          int &cor = id(luz_passo_cor);
          switch (x.command) {
            case 0xB946: ligada = !ligada; break;
            case 0xBB44: ligada = true; cor = 10; brilho = 10; break;  // WW
            case 0xBF40: ligada = true; cor = 5; brilho = 10; break;   // NW
            case 0xBC43: ligada = true; cor = 0; brilho = 10; break;   // W
            case 0xB847: if (ligada) brilho = 0; break;
            case 0xF609: if (ligada) brilho = std::min(brilho + 1, 10); break;
            case 0xF807: if (ligada) brilho = std::max(brilho - 1, 0); break;
            case 0xF20D: if (ligada) cor = std::max(cor - 1, 0); break;
            case 0xE916: if (ligada) cor = std::min(cor + 1, 10); break;
            default: return;
          }
          id(luz_alvo_ligada) = ligada;
          id(luz_alvo_brilho) = brilho;
          id(luz_alvo_cor) = cor;
          id(luz_extra_brilho) = 0;
          id(luz_extra_cor) = 0;
          id(luz_publicar).execute();
